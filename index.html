<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freemap - Smart Map Explorer</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-earth-asia"></i></div>
        <div>
          <h1>Freemap</h1>
          <p>Online Free Map Platform</p>
        </div>
      </div>

      <div class="search-panel">
        <label>장소 검색</label>

        <div class="search-row">
          <input id="searchInput" type="text" placeholder="예: Gangnam Station, Seoul"/>
          <button id="searchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <div class="action-buttons">
          <button id="locateBtn" class="secondary-btn">
            <i class="fa-solid fa-location-crosshairs"></i>
            현재 위치
          </button>

          <button id="themeBtn" class="secondary-btn">
            <i class="fa-solid fa-moon"></i>
            테마
          </button>
        </div>
      </div>

      <div class="info-card">
        <div class="card-header">
          <h2>위치 정보</h2>
        </div>

        <div id="locationInfo" class="location-info">
          지도를 클릭하거나 검색해보세요.
        </div>
      </div>

      <div class="info-card">
        <div class="card-header">
          <h2>빠른 기능</h2>
        </div>

        <div class="quick-actions">
          <button class="quick-btn" data-type="restaurant">
            <i class="fa-solid fa-utensils"></i>
            음식점
          </button>

          <button class="quick-btn" data-type="cafe">
            <i class="fa-solid fa-mug-hot"></i>
            카페
          </button>

          <button class="quick-btn" data-type="hospital">
            <i class="fa-solid fa-hospital"></i>
            병원
          </button>

          <button class="quick-btn" data-type="hotel">
            <i class="fa-solid fa-hotel"></i>
            호텔
          </button>
        </div>
      </div>

      <div class="footer">
        Powered by OpenStreetMap + Leaflet + Nominatim
      </div>
    </aside>

    <main class="map-wrapper">
      <div id="map"></div>

      <div class="floating-panel">
        <div class="panel-item">
          <span>줌</span>
          <strong id="zoomLevel">13</strong>
        </div>

        <div class="panel-item">
          <span>위도</span>
          <strong id="latText">-</strong>
        </div>

        <div class="panel-item">
          <span>경도</span>
          <strong id="lngText">-</strong>
        </div>
      </div>
    </main>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
